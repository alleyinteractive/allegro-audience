name: Built Branch and Release

on:
  push:
    branches:
      - develop
      - main
      - production

permissions:
  contents: write

jobs:
  release:
    name: "Built Branch and Release"
    runs-on: ubuntu-latest
    steps:
      - uses: alleyinteractive/action-release@develop
        with:
          # Releases created with the default GITHUB_TOKEN do not fire the
          # `release: published` event, which the WordPress.org deploy needs.
          # RELEASE_TOKEN is a PAT (contents: write) so the event fires.
          github-token: ${{ secrets.RELEASE_TOKEN || github.token }}
