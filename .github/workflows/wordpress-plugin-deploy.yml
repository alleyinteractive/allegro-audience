name: Deploy to WordPress.org

on:
  release:
    # `released` skips pre-releases, which should not reach WordPress.org.
    types:
      - released
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to deploy (e.g. v0.1.0)."
        required: true
        type: string
      dry-run:
        description: "Run the deploy without committing to Subversion."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: wordpress-org-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: "Deploy to WordPress.org"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Release tags point at the built branch, so this checks out the
      # deploy-ready tree created by the "Built Branch and Release" workflow.
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - name: Verify every version string matches the tag
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          PLUGIN_VERSION=$(grep -m1 -E '^\s*\*?\s*Version:' allegro-audience.php | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+')
          VERSION_CONSTANT=$(grep -m1 "ALLEGRO_AUDIENCE_VERSION" allegro-audience.php | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+')
          STABLE_TAG=$(grep -m1 -E '^Stable tag:' readme.txt | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+')

          echo "Tag: $TAG (version $VERSION)"
          echo "Plugin header version: $PLUGIN_VERSION"
          echo "ALLEGRO_AUDIENCE_VERSION: $VERSION_CONSTANT"
          echo "readme.txt stable tag: $STABLE_TAG"

          if [[ "$VERSION" != "$PLUGIN_VERSION" ]]; then
            echo "::error::Tag $TAG does not match the plugin header version $PLUGIN_VERSION."
            exit 1
          fi

          # The constant is the asset cache-busting version, so a stale value
          # ships new assets under the previous version's URL.
          if [[ "$VERSION" != "$VERSION_CONSTANT" ]]; then
            echo "::error::Tag $TAG does not match ALLEGRO_AUDIENCE_VERSION $VERSION_CONSTANT."
            exit 1
          fi

          # WordPress.org serves the version named by the stable tag, so a
          # mismatch would publish a release nobody can download.
          if [[ "$VERSION" != "$STABLE_TAG" ]]; then
            echo "::error::Tag $TAG does not match the readme.txt stable tag $STABLE_TAG."
            exit 1
          fi

          echo "PLUGIN_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Deploy to WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          dry-run: ${{ inputs.dry-run || false }}
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: allegro-audience
          VERSION: ${{ env.PLUGIN_VERSION }}
